name: CI/CD - Deploy a Azure VM

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    name: Desplegar (${{ github.ref_name }}) en VM con Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar despliegue remoto por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"
            if [ "$BRANCH" = "dev" ]; then
              TARGET_DIR="${{ secrets.VM_PROJECT_PATH }}-dev"
            else
              TARGET_DIR="${{ secrets.VM_PROJECT_PATH }}"
            fi

            echo "📂 Entrando al directorio del proyecto ($TARGET_DIR) para la rama $BRANCH..."
            cd "$TARGET_DIR"

            echo "⬇️ Descargando últimos cambios de $BRANCH..."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "🐳 Reconstruyendo y levantando contenedores..."
            docker compose up -d --build --remove-orphans

            echo "🧹 Limpiando imágenes antiguas sin uso..."
            docker image prune -f

            echo "✅ ¡Despliegue de $BRANCH completado con éxito!"

