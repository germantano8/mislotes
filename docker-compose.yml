services:
  # ==============================================================================
  # 1. Base de Datos: PostgreSQL 16
  # ==============================================================================
  db:
    image: postgres:16-alpine
    container_name: ${APP_NAME:-mislotes}_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-mislotes}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mislotes}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mislotes_net

  # ==============================================================================
  # 2. Servidor de Aplicación: Node.js / Express / Prisma
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-mislotes}_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@db:5432/${DB_NAME:-mislotes}?schema=agricultura
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-uploads}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - mislotes_net

  # ==============================================================================
  # 3. Servidor Web & Reverse Proxy: Nginx + Angular 19
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-mislotes}_frontend
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
    depends_on:
      - backend
    networks:
      - mislotes_net

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  mislotes_net:
    driver: bridge
